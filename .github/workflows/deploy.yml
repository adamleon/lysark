name: Build & deploy decks

# Builds every deck's self-contained offline HTML and publishes them to GitHub
# Pages, so the interactive lecture can be viewed from any browser (incl. a phone —
# tap the right side to advance, the left third to go back). Runs on pushes to the
# lecture branch and main, and on demand.
on:
  push:
    branches: [main, baneplanlegging-lecture]
  workflow_dispatch:

# least privilege + what Pages deployment needs
permissions:
  contents: read
  pages: write
  id-token: write

# one live deploy at a time; a newer push supersedes an in-flight one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # guards: don't publish a broken deck
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test

      # build one self-contained HTML per deck into public/, plus a landing page
      - name: Build decks
        run: |
          set -euo pipefail
          mkdir -p public
          for deck in baneplanlegging demo; do
            LYSARK_DECK="$deck" npm run build:offline
            cp "dist-offline/${deck}-offline.html" "public/${deck}.html"
          done
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="no">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Lysark – forelesningsdekk</title>
            <style>
              :root { color-scheme: dark; }
              * { box-sizing: border-box; }
              body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, sans-serif;
                background: #17161b; color: #f3eee7; display: flex; flex-direction: column;
                align-items: center; justify-content: center; gap: 26px; padding: 32px; }
              h1 { margin: 0; font-size: clamp(30px, 7vw, 46px); font-weight: 800; letter-spacing: -0.01em; }
              h1 span { color: #ff3b3b; }
              .sub { margin: 0; color: #9e97a1; font-size: 15px; text-align: center; }
              .decks { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; width: 100%; max-width: 760px; }
              a.card { flex: 1 1 300px; text-decoration: none; color: inherit; background: rgba(34, 31, 39, 0.9);
                border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 14px; padding: 22px 24px;
                transition: border-color 0.15s, transform 0.1s; }
              a.card:hover { border-color: #ff3b3b; transform: translateY(-2px); }
              a.card.primary { border-color: rgba(255, 59, 59, 0.5); }
              .card h2 { margin: 0 0 6px; font-size: 21px; color: #33e17c; }
              .card p { margin: 0; color: #9e97a1; font-size: 14px; line-height: 1.5; }
              .tag { display: inline-block; margin-bottom: 10px; font-size: 11px; letter-spacing: 0.05em;
                text-transform: uppercase; color: #9e97a1; }
              footer { color: #6b656f; font-size: 12.5px; text-align: center; max-width: 520px; line-height: 1.5; }
            </style>
          </head>
          <body>
            <div style="text-align:center">
              <h1>Lys<span>ark</span></h1>
              <p class="sub">Interaktive robotikk-forelesningslysbilder</p>
            </div>
            <div class="decks">
              <a class="card primary" href="./baneplanlegging.html">
                <span class="tag">AIS2105 · 15 lysbilder</span>
                <h2>Baneplanlegging</h2>
                <p>Fra konfigurasjon til rute: PTP/Lin, SE(3), tidsskalering (kubisk · trapes · S-kurve · femteordens). Ekte KUKA Agilus, live.</p>
              </a>
              <a class="card" href="./demo.html">
                <span class="tag">Regresjon · 11 lysbilder</span>
                <h2>Demo</h2>
                <p>PID-styring, spring-damper-kamera, scenelivssyklus – rammeverkets utstillingsvindu.</p>
              </a>
            </div>
            <footer>På mobil: trykk høyre side for neste lysbilde, venstre tredjedel for forrige · dra på roboten for å se rundt.</footer>
          </body>
          </html>
          HTML

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
