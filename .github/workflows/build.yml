name: Engine checks

# Every engine change is tested against a real lecture before any course pins
# it (lysark-v2.md §3). The demo lecture is built and offline-checked twice:
# from this checkout (the quick developer path), and with the engine packed by
# npm and installed into a scratch course with production dependencies only,
# which is how a course gets it. The course-style build is uploaded as the
# downloadable "demo" artifact. The editor runtime is built the same way, as
# the course site builds it for the VS Code extension, and booted in Chromium
# the way the extension's panel uses it (scripts/check-editor.mjs).
#
# The extension job builds the VS Code extension (extension/), which uses
# engine code, and uploads the .vsix that is published to the Marketplace.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Package rules (lysark-v2.md §3)
        run: |
          node -e "
            const p = require('./package.json')
            const bad = ['build', 'prepare', 'prepack', 'preinstall', 'install', 'postinstall'].filter((s) => p.scripts?.[s])
            if (p.workspaces) bad.push('workspaces')
            if (bad.length) {
              console.error('::error::package.json must not have: ' + bad.join(', ') + ' (npm would build the engine during every course install)')
              process.exit(1)
            }"

      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test

      - name: Install Chromium for the offline check
        run: npx playwright-core install --with-deps chromium

      - name: Build and check the demo from this checkout
        run: |
          node bin/lysark.mjs build demo
          node bin/lysark.mjs check dist/demo.html

      - name: Build and check the demo with the engine installed as a course installs it
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          course="$RUNNER_TEMP/course"
          mkdir -p "$course/lectures"
          cp -r lectures/demo "$course/lectures/"
          cd "$course"
          echo '{"name":"course","private":true,"type":"module"}' > package.json
          npm install --omit=dev --no-audit --no-fund "$RUNNER_TEMP"/lysark-*.tgz
          npx --no lysark build demo
          npx --no lysark check dist/demo.html
          npx --no lysark editor-build --out-dir editor
          node "$GITHUB_WORKSPACE/scripts/check-editor.mjs" editor lectures/demo/slides.md

      - uses: actions/upload-artifact@v4
        with:
          name: demo
          path: ${{ runner.temp }}/course/dist/demo.html
          if-no-files-found: error

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json

      # the engine's own packages too: the extension bundles engine code that uses them
      - run: npm ci
      - run: npm ci
        working-directory: extension

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: extension

      - name: Package the extension
        run: npm run package
        working-directory: extension

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extension/*.vsix
          if-no-files-found: error
