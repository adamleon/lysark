# This lecture's version of the engine's arm scene: the same arm, plus named
# camera views and poses. A slide uses them with `camera: overview` and
# `joints: reach` (docs/scene-files.md).
base: arm

views:
  overview:                  # the whole arm, from the front right
    lookAt: [0.1, 0.5, 0]
    offset: [1.4, 0.55, 1.2]
  tool:                      # close on the end effector, following it as it moves
    lookAt: end_effector
    offset: [0.4, 0.22, 0.5]
    spring: { omega: 5, zeta: 1.0 }

poses:                       # radians
  reach: [0.9, 1.1, -1.5]    # every joint, in order: joint1, joint2, joint3
  low: { joint2: 0.3 }       # only the joints it names

objects:                     # things in the scene (from v2.11.0), in metres and degrees
  table:                     # a work table beside the arm, out of its reach (0.65 m)
    box: [0.4, 0.3, 0.4]     # width, height, depth
    at: [0.62, 0, -0.69]     # the middle of its underside, on the floor (y is up)
    rotate: 48               # turned 48 degrees about the vertical, to face the arm
    material: wood
  part:                      # a workpiece on the table: at is in the table's frame
    cylinder: [0.07, 0.1]    # diameter, height
    at: [0, 0.3, 0]          # on the table's top
    parent: table
    material: blue
  grip:                      # no shape: an invisible point, on top of the part
    at: [0, 0.1, 0]
    parent: part
  base frame:                # the robot's base frame: on its anchor, z is up
    frame: 0.3               # the length of the axes
    parent: base
  tool frame:                # moves with the end effector
    frame: 0.1
    parent: end_effector
  # models (from v2.13.0): parts from files in the lecture's models/ folder
  bracket:                   # an STL from a CAD program: in millimetres, z up
    model: models/bracket.stl
    unit: mm
    up: z
    at: [0.1, 0.3, 0.1]      # the middle of its underside, on the table's top
    rotate: 180              # half a turn: the slide's camera sees into its corner
    parent: table
    material: metal
  tray:                      # a GLB from Blender: in metres and y up, as glTF is
    model: models/tray.glb
    at: [-0.1, 0.3, -0.1]
    parent: table
